<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MySQL demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    input { padding: 8px; width: 60%; }
    button { padding: 8px 14px; }
    button:disabled { opacity: .6; }
    li { margin: 6px 0; }
    small { color: #666; }
    #msg { margin: 12px 0; padding: 8px 12px; border-radius: 6px; display: none; }
    #msg.ok { display: block; background: #e6f6ea; color: #1b6b30; border: 1px solid #b6e2c2; }
    #msg.err { display: block; background: #fdeaea; color: #8a1c1c; border: 1px solid #f2bcbc; }
  </style>
</head>
<body>
  <h1>Ismingizni qoldiring</h1>
  <form id="form">
    <input id="name" placeholder="Ism" maxlength="100" autocomplete="off">
    <button id="btn" type="submit">Saqlash</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>
  <ul id="list"></ul>

<script>
const API = "/.netlify/functions/api";
const msgEl = document.getElementById("msg");

function showMsg(text, ok) {
  msgEl.textContent = text;
  msgEl.className = ok ? "ok" : "err";
}

async function callApi(options) {
  let res, data;
  try {
    res = await fetch(API, options);
  } catch {
    throw new Error("Serverga ulanib bo'lmadi (tarmoq xatosi)");
  }
  try {
    data = await res.json();
  } catch {
    throw new Error("Server noto'g'ri javob qaytardi (HTTP " + res.status + ")");
  }
  if (!res.ok || data.error) {
    throw new Error((data.error || "Xatolik") + (data.detail ? " [" + data.detail + "]" : ""));
  }
  return data;
}

function render(rows) {
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  rows.forEach(r => {
    const li = document.createElement("li");
    li.textContent = r.name + " ";
    const s = document.createElement("small");
    s.textContent = "(" + new Date(r.created_at).toLocaleString() + ")";
    li.appendChild(s);
    ul.appendChild(li);
  });
}

async function load() {
  try {
    const data = await callApi();
    render(data.rows);
  } catch (e) {
    showMsg("❌ Ro'yxatni yuklab bo'lmadi: " + e.message, false);
  }
}

document.getElementById("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const input = document.getElementById("name");
  const btn = document.getElementById("btn");
  const name = input.value.trim();
  if (!name) {
    showMsg("❌ Iltimos, ismni kiriting", false);
    return;
  }
  btn.disabled = true;
  try {
    const data = await callApi({
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    input.value = "";
    render(data.rows);
    showMsg("✅ Muvaffaqiyatli saqlandi!", true);
  } catch (e) {
    showMsg("❌ Saqlanmadi: " + e.message, false);
  } finally {
    btn.disabled = false;
  }
});

load();
</script>
</body>
</html>
